name: uhc
description: "University Health Center - Appointment Booking and Reminder System"
publish_to: 'none'

version: 2.4.0+24

environment:
  sdk: ^3.5.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # UI & Design
  cupertino_icons: ^2.0.0
  google_fonts: ^9.0.0
  shimmer: ^4.0.0
  lottie: ^3.6.1
  flutter_animate: ^4.5.2
  flutter_rating_bar: ^4.0.1
  
  # Firebase
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  firebase_messaging: ^17.0.1
  cloud_functions: ^7.0.1
  
  # Authentication
  google_sign_in: ^7.2.0
  
  # State Management
  provider: ^6.1.4
  
  # Notifications
  flutter_local_notifications: ^22.3.3
  
  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2
  
  # Calendar
  table_calendar: ^3.3.0
  
  # Images
  cached_network_image: ^4.0.5
  image_picker: ^1.2.4
  
  # Utilities
  intl: ^0.20.2
  url_launcher: ^6.3.3
  share_plus: ^13.3.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.6
  uuid: ^4.5.1
  
  # Charts for Admin
  fl_chart: ^1.3.0
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  crypto: ^3.0.7
  http: ^1.6.0
  firebase_storage: ^14.0.1
  file_picker: ^13.2.0
  package_info_plus: ^10.2.2
  firebase_crashlytics: ^6.0.1
  syncfusion_flutter_xlsio: ^35.1.41
  web: ^1.1.2
  pdfx: 2.11.0

dev_dependencies:
  flutter_driver:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/

flutter_launcher_icons:
  image_path: "assets/icons/Icon_app_new.png"
  android: true
  ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#00000000"
  adaptive_icon_foreground: "assets/icons/Icon_app_new.png"
  adaptive_icon_foreground_inset: 0
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icons/Icon_app_new.png"
    background_color: "#00000000"
    theme_color: "#00000000"
  windows:
    generate: true
    image_path: "assets/icons/Icon_app_new.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icons/Icon_app_new.png"
